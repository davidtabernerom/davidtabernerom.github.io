<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
	<meta charset="UTF-8">
	<title>{{ .Site.Title }} — {{ .Title }}</title>
	<link rel="stylesheet" type="text/css" crossorigin="anonymous" href="/css/style.css">
</head>
<body>
	<h1>All Projects</h1>
	<ul>
		{{ range (sort .Pages "Params.ReleaseDate" "desc") }}
		<li>
			<h2><a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong> ({{ .Date.Format "2006" }} - {{ .Params.ReleaseDate | time.Format "2006" }})</a></h2>
			<img src="{{ .Params.CoverLink }}" alt="{{ .Title }} cover" width="100">
			<p>{{ .Params.description }}</p>
		</li>
		{{ end }}
	</ul>
	<p><a href="/">← Back to Home</a></p>
</body>
</html>
