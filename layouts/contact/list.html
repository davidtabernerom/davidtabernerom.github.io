{{ define "article" }}
<article id="Contact">

	<ul>
	{{ range site.Data.socials }}
		<li>
			<a target="_blank" href="{{ .link }}">
				<div style="mask-image: url('{{ .image }}');"></div>
				<!--<img src="{{ .image }}" alt="{{ .id }}" />-->
				<span>{{ .label }}</span>
			</a>
		</li>
	{{ end }}
	</ul>

</article>
{{ end }}
