<header>
	<ul id="Breadcrumbs">
		<li class="Breadcrumb"><a href="{{ .Site.BaseURL }}">{{ (index (sort .Site.Menus.main "Weight") 0).Name }}</a></li>

		{{ if .Section }}
			<li class="Separator">/</li>
			<li class="Breadcrumb">
				<a href="{{ .Site.BaseURL }}{{ .Section }}/">{{ .CurrentSection.Title }}</a>
			</li>
		{{ end }}
		{{ if .IsPage }}
			<li class="Separator">/</li>
			<li class="Breadcrumb">
				<a href="{{ .Site.BaseURL }}{{ .Section }}/{{ .Title }}">{{ if .Params.ShortenedTitle }}{{ .Params.ShortenedTitle }}{{ else }}{{ .Title }}{{ end }}</a>
			</li>
		{{ end }}
	</ul>
</header>
